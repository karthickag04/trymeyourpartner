name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze, test, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Install packages (exactly as locked)
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Vendor portability check (docs/adr/0001)
        run: tool/check_vendor_imports.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        # The publishable key is only needed at run time; CI builds with a placeholder.
        run: flutter build web --dart-define=SUPABASE_KEY=ci-placeholder --no-web-resources-cdn

  admin_console:
    name: Admin console (analyze, test, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin_console
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Install packages (exactly as locked)
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        # The publishable key is only needed at run time; CI builds with a placeholder.
        run: flutter build web --dart-define=SUPABASE_KEY=ci-placeholder --no-web-resources-cdn

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Accept Android SDK licences and install the pinned NDK
        # android/app/build.gradle.kts pins ndkVersion; the runner does not
        # ship it, and Gradle cannot fetch it until the licences are accepted.
        run: |
          NDK=$(sed -nE 's/.*ndkVersion *= *"([^"]+)".*/\1/p' android/app/build.gradle.kts)
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "ndk;$NDK" > /dev/null
          echo "Installed NDK $NDK"

      - name: Build debug APK
        # The publishable key is only needed at run time; CI builds with a placeholder.
        run: flutter build apk --debug --dart-define=SUPABASE_KEY=ci-placeholder

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  database:
    name: Database (migrations + access rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice and check access rules
        run: supabase/tests/local/run.sh

  api:
    name: Backend API (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
